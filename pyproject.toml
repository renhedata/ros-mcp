[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ros-mcp"
version = "0.1.0"
description = "A multi-device MikroTik RouterOS MCP gateway over SSH"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.1,<2",
  "paramiko>=5,<6",
  "pydantic>=2.13,<3",
]

[project.scripts]
ros-mcp = "ros_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ros_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

